# Every setting of the study. The code reads nothing else.

master_seed = 20261102

[simulation]
n_visits = 3
rho_levels = [0.0, 0.5, 0.9]      # exchangeable correlation between visits
h0 = 0.1                          # baseline hazard
b = 0.6931471805599453            # ln 2
target_censored_fraction = 0.30
n_train = 1000
n_test = 500
n_reference = 100000              # large sample that sets the time grid

[scenarios]
# Driver visit per scenario.
A = 3
B = 1
part1 = ["A"]

[forest]
n_estimators = 200
max_features = 1.0                # all columns (sksurv default is "sqrt")
min_samples_leaf = 15

[tool]
calculation_method = "kernel"
aggregation_method = "integral"
n_grid = 50
grid_lower_quantile = 0.05
grid_upper_quantile = 0.80
n_background = 100
n_explained = 100

[runs]
n_datasets = 50                   # per correlation level
run1_n_datasets = 5
run2_n_shuffles = 5
n_jobs = 8                        # parallel workers

[scores]
# Credits this close to the maximum (relative) count as tied; survshap rounds at about 1e-7.
tie_rel_tol = 1e-6

[background_check]
# Confirms that 100 background rows is reasonable. Not a result.
dataset_index = 0
rho = 0.9
sizes = [50, 100, 200, 500]       # nested: each background contains the smaller ones

[analysis]
n_bootstrap = 10000               # resamples of datasets, never of patients
ci_level = 0.95

[lstm]
# The fixed settings; the tuned ones are a robustness check.
hidden_size = 16
learning_rate = 0.005
batch_size = 64
max_epochs = 300                  # upper bound; early stopping decides
patience = 20
val_fraction = 0.2                # of the training patients, for early stopping only
weight_decay = 0.0

[mirror]
# The forest in scenario B, compared patient by patient with scenario A.
n_datasets = 5

[seed_stability]
# Is the LSTM's choice between look-alike visits decided by the data or by training randomness?
scenarios = ["A", "B"]
rho = 0.9
n_datasets = 10
n_seeds = 5                       # extra LSTM training seeds per dataset, same data, same settings

[examples]
# Worked examples; the rules are in src/rtds/examples.py.
dataset_index = 0
typical_rho = 0.0                 # case A
failure_rho = 0.9                 # case B

[tuning]
# Datasets 1000-1002, never used in a reported result. Score: held-out integrated Brier score.
first_dataset = 1000
n_datasets = 3

[tuning.forest]
# Full grid per rho on scenario A; B is A with the visits relabelled.
max_features = [1, 2, 3]                  # visits considered at each split
min_samples_leaf = [3, 5, 10, 15, 25, 50]

[tuning.lstm]
# Optuna's TPE sampler, one seeded study per scenario x rho.
n_trials = 40
hidden_size = [8, 16, 32, 64]
learning_rate = [0.0003, 0.03]            # log scale
batch_size = [32, 64, 128]
patience = [10, 20, 40]
weight_decay = [0.00001, 0.01]            # log scale, or 0
